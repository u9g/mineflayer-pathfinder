name: Valen

# Builds the Valen compiler, runs the Valen tests in lib/valen/test, then builds the pathfinder
# with it and tests that against the JS search and in the plugin. Each step after the compiler
# runs even if an earlier one failed, so a run reports everything.

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/valen/**'
      - 'lib/valen*.js'
      - 'test/valen*'
      - '.github/workflows/valen.yml'
  pull_request:
    paths:
      - 'lib/valen/**'
      - 'lib/valen*.js'
      - 'test/valen*'
      - '.github/workflows/valen.yml'

env:
  VALEN_REF: 7cf925b1cc715e2a60c71e635412c17ef11a15ad
  RUST_NIGHTLY: nightly-2026-07-01
  VALEN_DIR: ${{ github.workspace }}/valen
  WASI_SDK_PATH: ${{ github.workspace }}/wasi-sdk

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check out Valen
        uses: actions/checkout@v4
        with:
          repository: valen-lang/valen
          ref: ${{ env.VALEN_REF }}
          path: valen

      # Two changes to Valen: its backend keeps unordered_maps of types it only forward-declares,
      # which macOS's libc++ accepts and Linux's libstdc++ rejects; and valec's --borrow-check
      # couldn't be turned off (lib/valen/build.sh says why the pathfinder needs that).
      #
      # The checkout is backdated first, so with the last run's build restored below, make and
      # cargo only rebuild what the patch touches.
      - name: Patch Valen
        run: |
          find valen -path valen/.git -prune -o -type f -exec touch -d 2000-01-01 {} +
          git -C valen apply "$GITHUB_WORKSPACE/lib/valen/valen.patch"

      - name: Install LLVM 21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-21 llvm-21-dev clang-21 libpolly-21-dev cmake build-essential zlib1g-dev libzstd-dev libcurl4-openssl-dev gdb
          echo "LLVM_CONFIG=/usr/bin/llvm-config-21" >> $GITHUB_ENV

      - name: Install wasi-sdk and wasmtime
        run: |
          mkdir -p "$WASI_SDK_PATH"
          curl -L https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz \
            | tar -xz -C "$WASI_SDK_PATH" --strip-components=1
          curl -sSf https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      # Valen uses #![feature(box_patterns)], which nightly removed in 1.100
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      # The newest build for this Valen and toolchain, whatever the patch, to build on
      - uses: actions/cache/restore@v4
        id: valec
        with:
          path: valen/target
          key: valec-${{ env.VALEN_REF }}-${{ env.RUST_NIGHTLY }}-${{ github.run_id }}
          restore-keys: valec-${{ env.VALEN_REF }}-${{ env.RUST_NIGHTLY }}-

      - name: Build valec
        run: cargo build --manifest-path valen/Cargo.toml --bin valec

      # Saved right away, so a failing test still keeps the built compiler
      - uses: actions/cache/save@v4
        with:
          path: valen/target
          key: ${{ steps.valec.outputs.cache-primary-key }}

      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 24

      - name: Valen tests
        run: lib/valen/test/run.sh
        env:
          VALEN_TEST_OUT: ${{ github.workspace }}/valen-test-out

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: valen-test-modules
          path: valen-test-out/*.wasm

      - name: Build pathfinder.wasm
        if: ${{ !cancelled() }}
        run: |
          exports=$(sed -n 's#^// exports: ##p' lib/valen/pathfinder.vale)
          lib/valen/build.sh lib/valen/pathfinder.wasm "$exports"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pathfinder-wasm
          path: lib/valen/pathfinder.wasm

      - run: npm install
        if: ${{ !cancelled() }}

      # The Valen search must match the JS one, and the plugin's own tests now search with it
      - name: Parity and plugin tests
        if: ${{ !cancelled() }}
        run: npx mocha --exit test/valenAStarTest.js test/internalTest.js
